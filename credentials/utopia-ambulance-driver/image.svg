<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="hexShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.15)"/>
    </filter>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f8ff"/>
    </linearGradient>
  </defs>

  <polygon points="256,20 472,138 472,374 256,492 40,374 40,138"
           fill="url(#hexGradient)"
           stroke="#1e3a8a"
           stroke-width="4"
           filter="url(#hexShadow)"/>

  <polygon points="256,50 442,158 442,354 256,462 70,354 70,158"
           fill="none"
           stroke="#dc2626"
           stroke-width="2"
           opacity="0.55"/>

  <g transform="translate(256, 256)">

    <!-- 1. Ambulance icon - 3x (72x72), top y=-135 to y=-63 -->
    <g transform="translate(-36, -135) scale(3)"
       fill="none" stroke="#1e3a8a" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 10H6"/>
      <path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/>
      <path d="M19 18h2a1 1 0 0 0 1-1v-3.28a1 1 0 0 0-.684-.948l-1.923-.641a1 1 0 0 1-.578-.502l-1.539-3.076A1 1 0 0 0 16.382 10H14"/>
      <path d="M8 8v4"/>
      <path d="M9 18h6"/>
      <circle cx="17" cy="18" r="2"/>
      <circle cx="7" cy="18" r="2"/>
    </g>

    <!-- 2. UTOPIA DMV - ~40px gap below icon bottom (y=-63) -->
    <text x="0" y="-14"
          text-anchor="middle"
          fill="#6b7280"
          font-family="Arial, sans-serif"
          font-size="13"
          font-weight="600"
          letter-spacing="3">
      UTOPIA DMV
    </text>

    <!-- 3. Holder name - ~40px gap below issuer, in widest part of hex -->
    <text x="0" y="50"
          text-anchor="middle"
          fill="#1e3a8a"
          font-family="Arial, sans-serif"
          font-size="28"
          font-weight="700">
      {{credentialSubject.name}}
    </text>

    <!-- 4. AMBULANCE DRIVER - ~40px gap below name -->
    <text x="0" y="107"
          text-anchor="middle"
          fill="#dc2626"
          font-family="Arial, sans-serif"
          font-size="15"
          font-weight="600"
          letter-spacing="2.5">
      AMBULANCE DRIVER
    </text>

  </g>

</svg>

<div>
  <script>

  document.addEventListener('DOMContentLoaded', (event) => {

    // display credential as JSON as an example renderer; anything
    // could be done here instead, including mustache/other-style
    // template processing to generate the HTML for display

    // FIXME: determine best name/location for the datablock/script tag
    const credential = JSON.parse(document.querySelector(
      'head > script[name="credential"]').innerHTML);

    const mustacheMe = document.querySelector('#mustache-me');
    mustacheMe.innerHTML = Mustache.render(mustacheMe.innerHTML, {
      'credentialSubject-name': credential.credentialSubject.name,
      'issuer-name': credential.issuer.name
    });

    pdfMake.createPdf({
      content: [
        { text: mustacheMe.innerText }
      ]
    }).getDataUrl().then((dataUrl) => {
      downloadButton.removeAttribute('hidden');
      downloadButton.href = dataUrl;
      window.renderMethodReady({ ready: true, pdf: dataUrl });
    }, err => {
      window.renderMethodReady({ error: { message: err.message } });
    });
  });
  </script>

  <style>
    h1 {
      color: blue;
    }
  </style>

  <div id='mustache-me'>
    <h1>{{credentialSubject-name}}</h1>
    <p>Issued by: {{ issuer-name }}</p>
  </div>
  <div id='iframeContainer'></div>
  <a id="downloadButton" download hidden type="application/pdf">Download</a>
</div>
